:root{--bg:#5C0A14;--card:#7A1424;--red:#B3122A;--gold:#F5B700;--ink:#fff;--mut:#F3D9DC;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#5C0A14}}
:root[data-theme="dark"]{--bg:#5C0A14}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}*{box-sizing:border-box}
button,kbd{font-family:inherit}body{margin:0;min-height:100%;font-family:CamEmb,Cambria,'Times New Roman',serif;color:var(--ink);background-color:var(--bg);background-image:repeating-radial-gradient(circle at 100% 100%,rgba(245,183,0,.07) 0 3px,transparent 3px 48px),radial-gradient(circle at 10% 0,rgba(179,18,42,.6),transparent 55%)}
#app{max-width:1040px;margin:0 auto;padding:18px}.screen{display:none}.screen.on{display:block;animation:pop .45s}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}}
@keyframes flo{50%{transform:translateY(-10px)}}@keyframes pul{50%{transform:scale(1.06)}}@keyframes shk{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center;min-height:86vh}
.tag{display:inline-block;background:var(--gold);color:#5C0A14;font-weight:900;padding:6px 14px;border-radius:99px;letter-spacing:.14em;font-size:12px}
h1{font-size:clamp(34px,6vw,64px);line-height:1.05;margin:16px 0;font-weight:900}h1 b{color:var(--gold)}
.sub{color:var(--mut);font-size:17px;line-height:1.6}.chips{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 26px}
.chips span{background:rgba(0,0,0,.28);border:1px solid rgba(245,183,0,.4);padding:8px 14px;border-radius:99px;font-size:14px}
.btn{font:inherit;font-weight:900;font-size:19px;background:var(--gold);color:#5C0A14;border:0;border-radius:16px;padding:16px 34px;cursor:pointer;box-shadow:0 6px 0 #b98a00;transition:.15s}.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b98a00}.pl{animation:pul 1.6s infinite}
.arch{border:7px solid var(--gold);border-radius:999px 999px 26px 26px;background-size:cover;background-position:center;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.hero .arch{width:min(100%,340px);aspect-ratio:3/4;margin:auto;animation:flo 4s infinite}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}.dots{display:flex;gap:6px;flex:1;min-width:150px}
.dots i{flex:1;height:10px;border-radius:9px;background:rgba(255,255,255,.18)}.dots i.ok{background:#22c55e}.dots i.no{background:#ef4444}.dots i.cur{background:var(--gold)}
.pill{background:rgba(0,0,0,.32);border-radius:14px;padding:8px 14px;font-weight:700}.pill b{color:var(--gold)}
.main{display:grid;grid-template-columns:230px 1fr;gap:20px;align-items:start}
.main .arch{width:100%;aspect-ratio:3/4}
.qc{background:var(--card);border-radius:22px;padding:22px;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.qn{color:var(--gold);font-weight:900;letter-spacing:.12em;font-size:13px}.qt{font-size:clamp(20px,3vw,28px);font-weight:900;line-height:1.3;margin:8px 70px 0 0}
.tm{position:absolute;right:16px;top:14px;width:58px;height:58px}.tm svg{transform:rotate(-90deg)}.tm circle{fill:none;stroke-width:6}.tm .bg{stroke:rgba(255,255,255,.18)}.tm .fg{stroke:var(--gold);stroke-linecap:round;stroke-dasharray:163.4;transition:stroke-dashoffset .1s linear}
.tm span{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:19px}
#opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.opt{font:inherit;color:#fff;text-align:left;border:0;border-radius:16px;padding:16px;display:flex;gap:12px;align-items:center;cursor:pointer;min-height:84px;position:relative;box-shadow:0 5px 0 rgba(0,0,0,.35);transition:.15s}
.opt:hover:not(:disabled){transform:translateY(-3px)}.opt .sym{font-size:24px;width:34px;text-align:center}.opt .tx{font-weight:700;font-size:16px;flex:1;line-height:1.3}
.opt kbd{position:absolute;right:10px;top:6px;font:700 11px inherit;opacity:.7}
.c0{background:#D6213D}.c1{background:#2563EB}.c2{background:#D98E04}.c3{background:#16A34A}
.opt.right{outline:5px solid #fff;animation:pul .5s 2;filter:brightness(1.15)}.opt.wrong{animation:shk .5s;opacity:.5}.opt.gone{visibility:hidden}.opt:disabled{cursor:default}
.tools{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px}
.ghost{font:inherit;font-weight:700;background:rgba(0,0,0,.3);color:#fff;border:1px solid rgba(245,183,0,.5);border-radius:12px;padding:9px 14px;cursor:pointer}.ghost:disabled{opacity:.35}
#fb{display:none;margin-top:16px;background:#fff;color:#2B1416;border-radius:18px;padding:16px 18px;animation:pop .35s}#fb.on{display:block}
#fb h3{margin:0 0 6px;font-size:22px}#fb.g h3{color:#15803d}#fb.b h3{color:#B3122A}#fb p{margin:0 0 12px;line-height:1.55}
.end{text-align:center;padding:24px 0}.end .arch{width:200px;aspect-ratio:3/4;margin:0 auto 14px}.rank{font-size:clamp(26px,5vw,44px);font-weight:900;color:var(--gold);margin:6px 0}
.stars{font-size:44px;letter-spacing:8px}.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:18px 0 24px}
.stat{background:var(--card);border-radius:18px;padding:14px 24px;min-width:120px}.stat b{display:block;font-size:30px;color:var(--gold)}
#cf{position:fixed;inset:0;pointer-events:none;z-index:9}#mute{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:10}
@media(max-width:720px){.hero,.main{grid-template-columns:1fr}.hero{min-height:auto}.main .arch{aspect-ratio:16/9;border-radius:22px}#opts{grid-template-columns:1fr}}

$('#hero').style.backgroundImage=`url(${IMG.hero})`;
function snd(f,d,ty='sine'){if(mute)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state=='suspended')ac.resume();const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
$('#mute').onclick=()=>{mute=!mute;$('#mute').textContent=mute?'🔇':'🔊'};
function start(){snd(523,.15);setTimeout(()=>snd(659,.15),120);setTimeout(()=>snd(784,.3),240);i=0;score=0;streak=0;best=0;right=0;used=false;$('#l50').disabled=false;res=[];show(1);load()}
let res=[];
function hud(){$('#sc').textContent=score;$('#stk').textContent=streak;$('#dots').innerHTML=Q.map((_,k)=>`<i class="${k<i?res[k]:k==i?'cur':''}"></i>`).join('')}
function load(){locked=false;const q=Q[i];order=shuf([0,1,2,3]);$('#qn').textContent=`CÂU ${i+1} / ${Q.length}`;$('#qt').textContent=q.q;$('#qimg').style.backgroundImage=`url(${IMG[q.i]})`;
$('#opts').innerHTML=order.map((k,j)=>`<button class="opt c${j}" data-k="${k}" onclick="ans(${k})"><span class="sym">${SY[j]}</span><span class="tx">${q.o[k]}</span><kbd>${'ABCD'[j]}</kbd></button>`).join('');
$('#fb').className='';t=TL;hud();tick();clearInterval(tm);tm=setInterval(()=>{const pt=Math.ceil(t);t=Math.max(0,t-.1);tick();if(t>0&&t<=5&&Math.ceil(t)<pt)snd(1000,.08,'square');if(t<=0)ans(-1)},100)}
function tick(){$('#tt').textContent=Math.ceil(t);$('#ring').style.strokeDashoffset=163.4*(1-t/TL);$('#ring').style.stroke=t<5?'#ef4444':'#F5B700'}
function fifty(){if(used||locked)return;used=true;$('#l50').disabled=true;snd(520,.15);const q=Q[i];shuf([0,1,2,3].filter(k=>k!=q.a)).slice(0,2).forEach(k=>{const b=document.querySelector(`.opt[data-k="${k}"]`);b.classList.add('gone');b.disabled=true})}
function ans(k){if(locked)return;locked=true;clearInterval(tm);const q=Q[i],ok=k==q.a;document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const v=+b.dataset.k;if(v==q.a)b.classList.add('right');else if(v==k)b.classList.add('wrong')});
let pts=0;if(ok){right++;streak++;best=Math.max(best,streak);pts=100+Math.round(t/TL*50)+(streak>1?(streak-1)*20:0);score+=pts;res[i]='ok';snd(660,.15);setTimeout(()=>snd(880,.25),130);boom(innerWidth/2,innerHeight/3,70)}else{streak=0;res[i]='no';snd(180,.4,'sawtooth')}
$('#fb').className='on '+(ok?'g':'b');$('#fh').textContent=ok?`Chính xác! +${pts} điểm${streak>1?` • Chuỗi ${streak} 🔥`:''}`:(k<0?'Hết giờ! ⏰':'Chưa đúng rồi!');$('#fp').textContent=q.e;$('#nx').textContent=i<Q.length-1?'Câu tiếp theo →':'Xem kết quả 🏆';hud()}
function next(){if(i<Q.length-1){i++;load()}else fin()}
function fin(){show(2);$('#eimg').style.backgroundImage=`url(${IMG.end})`;const r=[["Tân binh cần ôn lại","📚","Đừng lo, xem lại các slide rồi thử lại nhé!"],["Chiến binh tập sự","🔥","Bạn đã nắm được những ý chính!"],["Sứ giả kết nối","🌟","Rất tốt! Bạn hiểu bài khá vững."],["Chiến sĩ Đại Đoàn Kết","🏆","Tuyệt đối! Bạn xứng đáng là đại sứ đoàn kết!"]][right==Q.length?3:right>=5?2:right>=3?1:0];
$('#rk').textContent=r[1]+' '+r[0];$('#rs').textContent=r[2];$('#st').textContent='⭐'.repeat(right==Q.length?3:right>=5?2:right>=3?1:0)||'·';$('#fs').textContent=score;$('#fc').textContent=right+'/'+Q.length;$('#fb2').textContent=best;if(right>=3){[.25,.5,.75].forEach((x,k)=>setTimeout(()=>boom(innerWidth*x,innerHeight*.35,90),k*350));snd(784,.4)}}
addEventListener('keydown',e=>{const k=e.key.toUpperCase(),on=[...document.querySelectorAll('.screen')].findIndex(s=>s.classList.contains('on'));
if(on==1){const j='ABCD'.indexOf(k)>=0?'ABCD'.indexOf(k):'1234'.indexOf(k);if(!locked&&j>=0){const b=document.querySelectorAll('.opt')[j];if(b&&!b.disabled)b.click()}else if(locked&&(k=='ENTER'||k==' ')){e.preventDefault();next()}}else if(k=='ENTER')start()});
const cv=$('#cf'),cx=cv.getContext('2d');let P=[],run=false;const rs=()=>{cv.width=innerWidth;cv.height=innerHeight};rs();addEventListener('resize',rs);
function boom(x,y,n){const cl=['#F5B700','#ef4444','#fff','#22c55e','#3b82f6'];for(let k=0;k<n;k++){const a=Math.random()*6.28,v=3+Math.random()*7;P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-4,c:cl[k%5],s:4+Math.random()*6,l:70+Math.random()*40})}if(!run){run=true;loop()}}
function loop(){cx.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>p.l-->0);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.22;p.vx*=.99;cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.s,p.s*.6)});P.length?requestAnimationFrame(loop):(run=false,cx.clearRect(0,0,cv.width,cv.height))}
</script></body></html>
